{% extends "base.html" %}
{% block title %}ReceiptPro — Upload{% endblock %}
{% block content %}

<section id="upload-section">
  <div id="drop-zone" role="button" tabindex="0" aria-label="Drop receipts here or click to browse">
    <p>Drag &amp; drop receipts here</p>
    <p class="sub">or <label for="file-input" class="browse-link">browse files</label></p>
    <input type="file" id="file-input" multiple
           accept=".png,.jpg,.jpeg,.webp,.bmp,.tiff,.pdf" hidden />
    <p class="hint">Supported: PNG, JPG, WEBP, BMP, TIFF, PDF &mdash; up to 50 files</p>
  </div>

  <button id="upload-btn" disabled>Process Receipts</button>
</section>

<section id="progress-section" hidden>
  <h2>Processing&hellip;</h2>
  <div id="progress-bar-container">
    <div id="progress-bar"></div>
  </div>
  <p id="progress-label">Starting&hellip;</p>
  <ul id="result-list"></ul>
</section>

<section id="download-section" hidden>
  <h2>Done!</h2>
  <a id="download-link" href="#" class="btn-download">Download Excel</a>
  <button id="reset-btn">Process more receipts</button>
</section>

{% endblock %}
